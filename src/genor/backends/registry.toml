# External tools GeNor can drive.
#
# mode:
#   download   GeNor downloads a pinned binary on request (redistributable)
#   python     an importable Python package (module = ...)
#   user       the user installs it (licence forbids redistribution) and registers it:
#              genor backend add <name> <path>
#
# Platform keys: linux-x86_64, linux-x86_64-avx2, darwin-arm64, darwin-x86_64

[plink2]
description = "PLINK 2.0: clumping and LD computation against a reference panel"
version = "alpha7 (2026-11-07)"
mode = "download"
licence = "GPL-3"
redistributable = true
executable = "plink2"
version_args = ["--version"]
provides = ["clump", "ld"]
citation = "plink2"
