# Reference datasets GeNor can download on request.
#
# Every entry is checksum-pinned (sha256 computed by the maintainers; the pleioFDR files have no upstream checksum, so theirs are the
# hashes seen on 2026-11-25). An entry with `hash = ""` would be unpinned: GeNor refuses them unless
# the user passes --allow-unpinned, and records the hash it saw in the manifest.
#
# Fields: url, hash ("sha256:..."), size (bytes), build, ancestry,
# licence, unpack ("tgz" | "zip" | "gzip" | ""), provides (what methods use it),
# citation (key in citations.toml).

[ldsc-weights-eur]
description = "LDSC regression weights / LD scores, HapMap3 SNPs without MHC, 1000G Phase 3 EUR (the eur_w_ld_chr equivalent)"
url = "https://zenodo.org/api/records/10515792/files/1000G_Phase3_weights_hm3_no_MHC.tgz/content"
hash = "sha256:d3e29112c64766dcee0ad9ec69ebda3d24cbe29ddb559d75443b10bcf8756c91"
size = 12757654
build = "GRCh37"
ancestry = "EUR"
licence = "CC BY 4.0"
unpack = "tgz"
prefix = "1000G_Phase3_weights_hm3_no_MHC/weights.hm3_noMHC."
provides = ["ldsc.h2", "ldsc.rg"]
citation = "ldsc-ref-zenodo"

[ldsc-ldscores-eur]
