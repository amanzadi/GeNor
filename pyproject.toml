[project]
name = "genor"
dynamic = ["version"]
description = "Post-GWAS analysis toolkit built for AI agents: summary statistics in, reproducible results out."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/genor/methods/_ldsc/LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Amir H. Amanzadi" }]
keywords = ["GWAS", "post-GWAS", "genetics", "LDSC", "Mendelian randomisation", "MCP", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=15",
    "httpx>=0.27",
    "platformdirs>=4",
    "pooch>=1.8",
    "matplotlib>=3.8",
    "fastmcp>=4.0",
]

[project.scripts]
genor = "genor.cli:main"

[project.urls]
Homepage = "https://github.com/amanzadi/GeNor"
Documentation = "https://amanzadi.github.io/GeNor/"
Issues = "https://github.com/amanzadi/GeNor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/genor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genor"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "genor/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "docs", "README.md", "LICENSE", "AGENTS.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/genor/methods/_ldsc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real remote APIs (run in the nightly job, not on every push)",
    "slow: downloads reference data",
]
addopts = "-m 'not live and not slow'"
