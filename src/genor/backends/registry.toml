[magma]
description = "MAGMA: gene, gene-set and gene-property (cell type) analysis"
version = "1.10"
mode = "user"
licence = "Proprietary, free for academic use; may not be redistributed"
redistributable = false
executable = "magma"
version_args = ["--version"]
provides = ["magma.gene", "magma.geneset", "magma.geneprop"]
citation = "magma"
install = "Download MAGMA from https://cncr.nl/research/magma/ (accept the licence), unzip, then: genor backend add magma /path/to/magma"

[pleiofdr]
description = "pleioFDR (Python port, no MATLAB): condFDR / conjFDR"
version = "2.0.0 (espenhgn/pleiofdr python-port @ 45e03b9)"
mode = "python"
module = "pleiofdr"
licence = "GPL-3.0-only"
redistributable = true
executable = "pleiofdr"
version_args = []
provides = ["pleio.condfdr", "pleio.conjfdr"]
citation = "pleiofdr"
requirement = "pleiofdr @ git+https://github.com/espenhgn/pleiofdr@45e03b9c98c48ce9ef1496c4173a5581b23a853d"
install = "Needs Python >= 3.13. Run GeNor with the port added: uvx --python 3.13 --with 'pleiofdr @ git+https://github.com/espenhgn/pleiofdr@45e03b9c98c48ce9ef1496c4173a5581b23a853d' genor ...  (or: uv tool install genor --python 3.13 --with '<same spec>')"
